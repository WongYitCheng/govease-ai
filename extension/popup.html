<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .header-icon {
      font-size: 24px;
    }
    
    .header-title {
      color: #1D9E75;
      font-size: 18px;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    
    .portal-section {
      margin-bottom: 16px;
    }
    
    .portal-label {
      font-size: 12px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
      display: block;
    }
    
    .portal-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 13px;
      background: white;
      cursor: pointer;
    }
    
    .status-card {
      background: #e8f8f2;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #0a5c3e;
      min-height: 100px;
    }
    
    .status-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-content {
      font-family: monospace;
      font-size: 11px;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .btn-primary {
      background: #1D9E75;
      color: white;
    }
    
    .btn-primary:hover {
      background: #158a63;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: #f0f2f5;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e4e6e9;
    }
    
    .footer {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
    
    .error {
      color: #c0392b;
    }
    
    .success {
      color: #1D9E75;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-icon">🏛️</span>
      <span class="header-title">GovEase AI</span>
    </div>
    <div class="subtitle">Your intelligent government form assistant</div>
    
    <div class="portal-section">
      <label class="portal-label">🔒 Watermark for:</label>
      <select id="portalSelect" class="portal-select">
        <option value="LHDN">LHDN (Tax / Hasil)</option>
        <option value="PTPTN">PTPTN (Loan)</option>
        <option value="EPF">EPF (Savings / KWSP)</option>
      </select>
    </div>
    
    <div id="statusCard" class="status-card">
      <div class="status-title">
        <span>📋</span> Status
      </div>
      <div id="statusContent" class="status-content">Loading...</div>
    </div>
    
    <button id="reloadBtn" class="btn btn-secondary">⟳ Reload Data</button>
    <button id="saveBtn" class="btn btn-primary">💾 Send Data to Extension</button>
    
    <div class="footer">
      🔐 Data stored locally | Powered by ILMU GLM-5.1
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
