<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width:280px; padding:16px; font-family:sans-serif; }
    h2 { color:#1D9E75; font-size:15px; margin-bottom:8px; }
    p { font-size:12px; color:#555; line-height:1.5; }
    .status { margin-top:12px; padding:8px 12px; background:#e8f8f2;
              border-radius:8px; font-size:12px; color:#0a5c3e; }
    button { margin-top:12px; width:100%; padding:10px;
             background:#1D9E75; color:white; border:none;
             border-radius:8px; cursor:pointer; font-size:13px; }
  </style>
</head>
<body>
  <h2>GovEase AI</h2>
  <p>Your intelligent government form assistant.</p>
  <div class="status" id="status">Checking for saved data...</div>
  <button onclick="loadData()">Reload Data</button>
  <script>
    function loadData() {
      chrome.storage.local.get("govease_user_data", (result) => {
        const el = document.getElementById("status")
        if (result.govease_user_data) {
          const d = result.govease_user_data
          el.innerHTML = `Ready to fill forms!<br>
            Name: ${d.full_name || "—"}<br>
            IC: ${d.ic_number || "—"}`
        } else {
          el.textContent = "No data yet. Upload IC on GovEase AI chat first."
        }
      })
    }
    loadData()
  </script>
</body>
</html>
